services:
  postgres:
    image: postgres:16-alpine
    container_name: clh_postgres
    environment:
      POSTGRES_USER: clh
      POSTGRES_PASSWORD: clh
      POSTGRES_DB: clh
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clh -d clh"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: clh_redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
